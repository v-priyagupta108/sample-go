name: Test go-version-file prerelease support

on:
  push:

jobs:
  # 1. go.mod with `toolchain` directive -> rc IS matched by the regex
  go-mod-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create go.mod with rc toolchain
        run: |
          mkdir -p fixtures/toolchain
          cat > fixtures/toolchain/go.mod <<'EOF'
          module example.com/toolchain

          go 1.24.0

          toolchain go1.25rc1
          EOF
      - uses: actions/setup-go@v7
        id: setup
        with:
          go-version-file: fixtures/toolchain/go.mod
      - name: Report
        run: |
          echo "resolved: ${{ steps.setup.outputs.go-version }}"
          go version

  # 2. go.mod with only a `go` directive -> beta/rc suffix is DROPPED
  go-mod-go-directive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create go.mod with rc in go directive
        run: |
          mkdir -p fixtures/godirective
          cat > fixtures/godirective/go.mod <<'EOF'
          module example.com/godirective

          go 1.27rc1
          EOF
      - uses: actions/setup-go@v7
        id: setup
        with:
          go-version-file: fixtures/godirective/go.mod
      - name: Report
        run: |
          echo "resolved: ${{ steps.setup.outputs.go-version }}"
          echo "expected 1.25rc1, likely got a stable 1.25.x"
          go version

  # 3. .go-version -> contents passed through verbatim, beta works
  go-version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .go-version with beta
        run: |
          mkdir -p fixtures/goversion
          echo '1.25beta1' > fixtures/goversion/.go-version
      - uses: actions/setup-go@v7
        id: setup
        with:
          go-version-file: fixtures/goversion/.go-version
      - name: Report
        run: |
          echo "resolved: ${{ steps.setup.outputs.go-version }}"
          go version

  # 4. .tool-versions -> value passed through verbatim, rc works
  tool-versions-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .tool-versions with rc
        run: |
          mkdir -p fixtures/toolversions
          echo 'golang 1.25rc1' > fixtures/toolversions/.tool-versions
      - uses: actions/setup-go@v7
        id: setup
        with:
          go-version-file: fixtures/toolversions/.tool-versions
      - name: Report
        run: |
          echo "resolved: ${{ steps.setup.outputs.go-version }}"
          go version
